name: Actions

# The setup and pulumi actions in .github/actions, run as a product's workflow runs them, with no cloud: the Pulumi
# state is a local file backend. Runs on a pull request that changes the actions, the package whose version they read,
# or the lockfile that sets the Pulumi version. The site-deploy job runs site-deploy's artifact prep and the locked
# Vercel CLI install on hostile artifacts, with a fake vercel first on PATH and no Vercel credentials.

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/site-deploy/**
      - .github/workflows/actions.yml
      - .github/workflows/site-*.yml
      - packages/infra/**
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  pulumi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Another pulumi first on PATH, so the check after setup fails unless setup's GITHUB_PATH entry wins, whether or
      # not the runner image has a pulumi of its own.
      - name: A decoy pulumi first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/decoy"
          printf '#!/bin/sh\necho v0.0.0-decoy\n' > "$RUNNER_TEMP/decoy/pulumi"
          chmod +x "$RUNNER_TEMP/decoy/pulumi"
          echo "$RUNNER_TEMP/decoy" >> "$GITHUB_PATH"

      - name: Before setup, the decoy wins and no token is set
        run: |
          test "$(command -v pulumi)" = "$RUNNER_TEMP/decoy/pulumi"
          test "$(pulumi version)" = v0.0.0-decoy
          test -z "${GITHUB_TOKEN:-}"

      - name: Setup, the Pulumi CLI version from basefresh's installed @pulumi/pulumi
        uses: ./.github/actions/setup
        with:
          infra: examples/basefresh

      - name: The pulumi on PATH is setup's, at that version, and the plugin token is the job's
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          expected="v$(node -p "require('./examples/basefresh/node_modules/@pulumi/pulumi/package.json').version")"
          test "$(command -v pulumi)" = "$HOME/.pulumi/bin/pulumi"
          test "$(pulumi version)" = "$expected"
          test "${GITHUB_TOKEN:-}" = "$JOB_TOKEN"
          echo "pulumi $(pulumi version) from $(command -v pulumi)"

      - name: Build @pebbletech/infra
        run: pnpm --filter @pebbletech/infra build

      # A product's infra/ installing this checkout's @pebbletech/infra, with a program in Pulumi YAML that creates
      # nothing, so `up` needs no provider and no cloud.
      - name: A throwaway product
        run: |
          infra="$RUNNER_TEMP/product/infra"
          # pulumi login file://… needs the directory to exist.
          mkdir -p "$infra" "$RUNNER_TEMP/state"
          printf '{"name":"selftest-infra","private":true,"dependencies":{"@pebbletech/infra":"link:%s"}}\n' \
            "$GITHUB_WORKSPACE/packages/infra" > "$infra/package.json"
          cat > "$infra/Pulumi.yaml" << 'EOF'
          name: selftest
          runtime: yaml
          config:
            greeting:
              type: string
          outputs:
            outputs:
              greeting: ${greeting}
              databaseUrl: postgresql://example.invalid/selftest
              secretValue:
                fn::secret: "say \"hi\" \\ back\nslash"
          EOF
          printf '%s\n' "export const entries = [{ key: 'greeting', env: 'GREETING', secret: false, required: true, stacks: ['staging'] }];" \
            > "$infra/entries.mjs"
          pnpm --dir "$infra" install --offline

      - name: pebble-infra up through the pulumi action
        id: up
        uses: ./.github/actions/pulumi
        env:
          PULUMI_BACKEND_URL: file://${{ runner.temp }}/state
          PULUMI_SECRETS_PROVIDER: passphrase
          PULUMI_CONFIG_PASSPHRASE: selftest
          PEBBLE_INFRA_VALUES: '{"GREETING":"hello from the values"}'
        with:
          command: up
          stack: staging
          entries: entries.mjs
          clear-lock: true
          infra: ${{ runner.temp }}/product/infra

      # secretValue is a Pulumi secret holding a quote, a backslash and a newline: the CLI masks it and writes it in the
      # heredoc form, and the action's JSON must hand it on unchanged.
      - name: The action handed on what up wrote, the secret exactly
        env:
          GREETING: ${{ fromJSON(steps.up.outputs.json).greeting }}
          DATABASE_URL: ${{ fromJSON(steps.up.outputs.json).database_url }}
          SECRET: ${{ fromJSON(steps.up.outputs.json).secret_value }}
        run: |
          test "$GREETING" = 'hello from the values'
          test "$DATABASE_URL" = 'postgresql://example.invalid/selftest'
          expected="$(printf 'say "hi" \\ back\nslash')"
          test "$SECRET" = "$expected"
          echo "secret, which the log should mask: $SECRET"

  caller-token:
    runs-on: ubuntu-latest
    # A token the job sets wins over the one setup would export.
    env:
      GITHUB_TOKEN: caller-token-for-the-self-test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup, with the caller's token already set
        uses: ./.github/actions/setup
        with:
          infra: examples/basefresh

      - name: The token is still the caller's
        run: test "$GITHUB_TOKEN" = caller-token-for-the-self-test

  no-pulumi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup without the Pulumi CLI
        uses: ./.github/actions/setup
        with:
          pulumi: false

      - name: Node.js from .nvmrc and pnpm are set up; no Pulumi CLI and no token from setup
        run: |
          test "$(node --version | cut -d. -f1)" = "v$(cat .nvmrc)"
          pnpm --version
          test ! -e "$HOME/.pulumi/bin/pulumi"
          test -z "${GITHUB_TOKEN:-}"

  site-deploy:
    runs-on: ubuntu-latest
    env:
      SCRIPT: ${{ github.workspace }}/.github/site-deploy/site-deploy.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # It records where it ran, what it was given and what the directory held, and deploys nothing. These steps run the
      # script's commands as site-deploy.yml's steps do, not those steps' own text: that text is held to its rules by
      # packages/infra/src/site-deploy.test.ts, and the real CLI and GitHub API calls are not run here.
      - name: A fake vercel first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          cat > "$RUNNER_TEMP/fake/vercel" << 'EOF'
          #!/bin/sh
          {
            echo "cwd=$(pwd)"
            echo "args=$*"
            echo "project=$VERCEL_PROJECT_ID org=$VERCEL_ORG_ID"
            find . -type f | sort
          } > "$RUNNER_TEMP/fake/calls"
          echo https://fake-deployment.vercel.app
          EOF
          chmod +x "$RUNNER_TEMP/fake/vercel"
          echo "$RUNNER_TEMP/fake" >> "$GITHUB_PATH"

      - name: A hostile artifact (project link, builds.json, a package.json with a postinstall)
        run: |
          a="$RUNNER_TEMP/hostile"
          mkdir -p "$a/static" "$a/functions/api.func"
          echo '{"version":3}' > "$a/config.json"
          echo '{"target":"production"}' > "$a/builds.json"
          echo '{"projectId":"prj_attacker","orgId":"team_attacker"}' > "$a/project.json"
          echo '{"scripts":{"postinstall":"touch $RUNNER_TEMP/pwned"}}' > "$a/package.json"
          echo '<h1>site</h1>' > "$a/static/index.html"
          echo '{"runtime":"nodejs24.x","handler":"index.mjs"}' > "$a/functions/api.func/.vc-config.json"
          echo 'export default () => new Response("ok")' > "$a/functions/api.func/index.mjs"

      - name: Prepare it, and deploy it with main's ids through the fake vercel
        env:
          VERCEL_PROJECT_ID: prj_main
          VERCEL_ORG_ID: team_main
        run: |
          node "$SCRIPT" prepare "$RUNNER_TEMP/hostile" "$RUNNER_TEMP/deploy" --root-directory apps/marketing
          cd "$RUNNER_TEMP/deploy"
          # The project's root directory, as main passes it: an empty directory beside .vercel, never inside it.
          test -d apps/marketing
          test -z "$(ls -A apps/marketing)"
          test ! -e .vercel/output/apps
          test "$(ls -A . | wc -l)" = 2
          vercel deploy --prebuilt --environment=preview --yes > "$RUNNER_TEMP/deploy-out"
          GITHUB_OUTPUT="$RUNNER_TEMP/outputs" node "$SCRIPT" deployment-url "$RUNNER_TEMP/deploy-out"
          grep -qx 'url=https://fake-deployment.vercel.app' "$RUNNER_TEMP/outputs"
          cat "$RUNNER_TEMP/fake/calls"
          grep -qx "project=prj_main org=team_main" "$RUNNER_TEMP/fake/calls"
          # Every file the CLI could see is under .vercel/output, and no project link or build report is among them.
          # (`if`, not `!`: bash -e ignores a negated command's failure.)
          if grep '^\./' "$RUNNER_TEMP/fake/calls" | grep -v '^\./\.vercel/output/'; then exit 1; fi
          if grep -e project.json -e builds.json "$RUNNER_TEMP/fake/calls"; then exit 1; fi
          test ! -e package.json
          test ! -e "$RUNNER_TEMP/pwned"

      - name: A symlink, a .vercel directory and a function's filePathMap are each refused
        run: |
          for case in symlink dotvercel filepathmap; do
            a="$RUNNER_TEMP/$case"
            mkdir -p "$a/static" "$a/functions/api.func"
            echo '{"version":3}' > "$a/config.json"
            echo '{"runtime":"nodejs24.x"}' > "$a/functions/api.func/.vc-config.json"
            case "$case" in
              symlink) ln -s /etc/passwd "$a/static/passwd" ;;
              dotvercel) mkdir -p "$a/static/.vercel" && echo '{}' > "$a/static/.vercel/project.json" ;;
              filepathmap) echo '{"filePathMap":{"a.js":"/etc/passwd"}}' > "$a/functions/api.func/.vc-config.json" ;;
            esac
            if node "$SCRIPT" prepare "$a" "$RUNNER_TEMP/out-$case"; then
              echo "::error::prepare took the $case artifact"
              exit 1
            fi
          done

      - name: The locked Vercel CLI installs with scripts off, at the workflow's default version
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/site-deploy/vercel
          expected="$(node -p "require('./.github/site-deploy/vercel/package-lock.json').packages['node_modules/vercel'].version")"
          test "$(.github/site-deploy/vercel/node_modules/.bin/vercel --version | tail -n 1)" = "$expected"
