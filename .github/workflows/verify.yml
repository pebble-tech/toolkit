name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # @pebbletech/infra's preview-stack tests (stack.postgres.test.ts, cli.test.ts) create and drop databases and roles,
    # some with a non-superuser admin as PlanetScale gives one; in CI they fail without this service rather than skip.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint, format, typecheck, build, tests)
        run: pnpm verify

      # The filter leaves out the private workspace root, which pnpm -r pack would otherwise pack too.
      - name: Pack every package
        run: pnpm -r --filter './packages/*' pack --pack-destination out

      - name: List tarball contents
        run: |
          for tarball in out/*.tgz; do
            echo "== $tarball"
            tar -tzf "$tarball"
          done
