name: pebble-aws-bootstrap
description: Shared AWS bootstrap per account (stacks stg, prd) - GitHub OIDC provider, Pulumi state bucket, state KMS keys
runtime:
  name: nodejs
  options:
    # Pulumi's TypeScript peer is <7: the program is compiled with tsc (`pnpm build`) and Pulumi runs the JS.
    typescript: false
main: dist/index.js
