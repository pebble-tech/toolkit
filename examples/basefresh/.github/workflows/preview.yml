name: Preview

# Every pull request gets its own stack, pr-<N>, holding its database basefresh_pr_<N> on the staging cluster. The
# deploy migrates before `pulumi up`, except on the PR's first push, when there is no database yet: then it migrates
# right after. Closing the PR removes the stack and drops the database.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

env:
  APEX: pebbletech.my

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    # Every job on pr-<N>, close included, holds this PR's one group. A newer push cancels the run in progress; the
    # lock that run leaves belongs to this group, and the next `up --clear-lock` or `remove --clear-lock` clears it.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_BACKEND_URL: s3://pebble-stg-pulumi-state/basefresh/preview?region=ap-southeast-1
      PULUMI_SECRETS_PROVIDER: awskms://alias/pebble-stg-pulumi-preview?region=ap-southeast-1
      # Pulumi downloads provider plugins from GitHub releases; the token lifts the unauthenticated rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # T2: the toolkit's setup action replaces this step and the next four.
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Pulumi plugins
        uses: actions/cache@v5
        with:
          path: ~/.pulumi/plugins
          key: ${{ runner.os }}-pulumi-plugins-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.271.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Build the infra program
        run: pnpm --dir infra build

      - name: Assume the preview deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: The PR's database URL, before up (nothing on its first push)
        id: before
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          pnpm --dir infra exec pebble-infra outputs "pr-${{ github.event.pull_request.number }}" --github-output --if-exists

      - name: Migrate the PR's database
        if: steps.before.outputs.database_url != ''
        env:
          DATABASE_URL: ${{ steps.before.outputs.database_url }}
        run: pnpm db:migrate

      - name: Pulumi up (pr-<N>)
        id: up
        env:
          PEBBLE_INFRA_VALUES: ${{ toJSON(secrets) }}
        run: pnpm --dir infra exec pebble-infra up "pr-${{ github.event.pull_request.number }}" --entries dist/entries.js --clear-lock

      - name: Migrate the PR's new database (first push)
        if: steps.before.outputs.database_url == ''
        env:
          DATABASE_URL: ${{ steps.up.outputs.database_url }}
        run: pnpm db:migrate

      # The web preview deploy follows here (T6).

  close:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_BACKEND_URL: s3://pebble-stg-pulumi-state/basefresh/preview?region=ap-southeast-1
      PULUMI_SECRETS_PROVIDER: awskms://alias/pebble-stg-pulumi-preview?region=ap-southeast-1
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # T2: the toolkit's setup action replaces this step and the next four.
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Pulumi plugins
        uses: actions/cache@v5
        with:
          path: ~/.pulumi/plugins
          key: ${{ runner.os }}-pulumi-plugins-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.271.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Build the infra program
        run: pnpm --dir infra build

      - name: Assume the preview deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Remove the PR's stack and drop its database
        env:
          PEBBLE_INFRA_VALUES: ${{ toJSON(secrets) }}
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          pnpm --dir infra exec pebble-infra remove "pr-${{ github.event.pull_request.number }}" --entries dist/entries.js --clear-lock
