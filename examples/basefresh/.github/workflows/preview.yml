name: Preview

# Every pull request gets its own stack, pr-<N>, holding its database basefresh_pr_<N> on the staging cluster. The
# deploy prepares the stack, then migrates before `pulumi up`, except when there is no database yet (the PR's first
# push, or a stack prepare reset): then it migrates right after. Closing the PR removes the stack and drops the
# database.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

env:
  APEX: pebbletech.my

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    # Every job on pr-<N>, close included, holds this PR's one group. A newer push cancels the run in progress; the
    # lock that run leaves belongs to this group, and the next `up --clear-lock` or `remove --clear-lock` clears it.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_BACKEND_URL: s3://pebble-stg-pulumi-state/basefresh/preview?region=ap-southeast-1
      PULUMI_SECRETS_PROVIDER: awskms://alias/pebble-stg-pulumi-preview?region=ap-southeast-1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm, Node.js, the dependencies and the Pulumi CLI
        # Placeholder: the all-zero SHA and the version comment are replaced after the release, by the commit
        # tagged @pebbletech/infra@0.4.0-next.0 and that version.
        uses: pebble-tech/toolkit/.github/actions/setup@0000000000000000000000000000000000000000 # @pebbletech/infra@0.4.0

      - name: Build the infra program
        run: pnpm --dir infra build

      - name: Assume the preview deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      # Before the URL read: a stack an interrupted run left is reset here, which drops its database, so the read must
      # see the stack up will use (empty after a reset, and then the database is migrated right after up).
      - name: Prepare the PR's stack (pr-<N>)
        env:
          PEBBLE_INFRA_VALUES: ${{ toJSON(secrets) }}
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          pnpm --dir infra exec pebble-infra prepare "pr-${{ github.event.pull_request.number }}" --entries dist/entries.js --clear-lock

      - name: The PR's database URL, before up (nothing on its first push or after a reset)
        id: before
        run: pnpm --dir infra exec pebble-infra outputs "pr-${{ github.event.pull_request.number }}" --github-output --if-exists

      - name: Migrate the PR's database
        if: steps.before.outputs.database_url != ''
        env:
          DATABASE_URL: ${{ steps.before.outputs.database_url }}
        run: pnpm db:migrate

      - name: Pulumi up (pr-<N>)
        id: up
        env:
          PEBBLE_INFRA_VALUES: ${{ toJSON(secrets) }}
        run: pnpm --dir infra exec pebble-infra up "pr-${{ github.event.pull_request.number }}" --entries dist/entries.js --clear-lock

      - name: Migrate the PR's new database (first push or after a reset)
        if: steps.before.outputs.database_url == ''
        env:
          DATABASE_URL: ${{ steps.up.outputs.database_url }}
        run: pnpm db:migrate

      # The web preview deploy to Vercel goes here, left out of this example: examples/web-only's
      # deploy-production.yml has the step for production.

  close:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_BACKEND_URL: s3://pebble-stg-pulumi-state/basefresh/preview?region=ap-southeast-1
      PULUMI_SECRETS_PROVIDER: awskms://alias/pebble-stg-pulumi-preview?region=ap-southeast-1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm, Node.js, the dependencies and the Pulumi CLI
        # Placeholder: the all-zero SHA and the version comment are replaced after the release, by the commit
        # tagged @pebbletech/infra@0.4.0-next.0 and that version.
        uses: pebble-tech/toolkit/.github/actions/setup@0000000000000000000000000000000000000000 # @pebbletech/infra@0.4.0

      - name: Build the infra program
        run: pnpm --dir infra build

      - name: Assume the preview deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Remove the PR's stack and drop its database
        env:
          PEBBLE_INFRA_VALUES: ${{ toJSON(secrets) }}
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          pnpm --dir infra exec pebble-infra remove "pr-${{ github.event.pull_request.number }}" --entries dist/entries.js --clear-lock
