name: Deploy production

# Each published release: migrate prod's database, `pulumi up` prod, then a read-only smoke.

on:
  release:
    types: [published]

# Holds the whole run, deploy then smoke, so a release's smoke checks that release's deploy. queue: max: by default a
# group keeps one pending run and a newer one cancels it, which would drop a waiting release.
concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  APEX: pebbletech.my

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # One group with deploy-staging.yml's prod-preview: a preview never runs while prod deploys. This is the only job
    # that clears prod's lock (`--clear-lock`). Queue, never cancel.
    concurrency:
      group: pulumi-prod
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_BACKEND_URL: s3://pebble-prd-pulumi-state/basefresh/prod?region=ap-southeast-1
      PULUMI_SECRETS_PROVIDER: awskms://alias/pebble-prd-pulumi-prod?region=ap-southeast-1
      # Pulumi downloads provider plugins from GitHub releases; the token lifts the unauthenticated rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # T2: the toolkit's setup action replaces this step and the next four.
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Pulumi plugins
        uses: actions/cache@v5
        with:
          path: ~/.pulumi/plugins
          key: ${{ runner.os }}-pulumi-plugins-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.271.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Build the infra program and the bundles
        run: pnpm --dir infra build

      - name: Assume the prod deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Prod's database URL, before up (nothing before the first release)
        id: before
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          pnpm --dir infra exec pebble-infra outputs prod --github-output --if-exists

      - name: Migrate prod
        if: steps.before.outputs.database_url != ''
        env:
          DATABASE_URL: ${{ steps.before.outputs.database_url }}
        run: pnpm db:migrate

      - name: Pulumi up (prod)
        id: up
        env:
          PEBBLE_INFRA_VALUES: ${{ toJSON(secrets) }}
        run: pnpm --dir infra exec pebble-infra up prod --entries dist/entries.js --clear-lock

      - name: Migrate prod's new database (first release)
        if: steps.before.outputs.database_url == ''
        env:
          DATABASE_URL: ${{ steps.up.outputs.database_url }}
        run: pnpm db:migrate

      # The web deploy to Vercel's production target follows here (T6).

  smoke:
    # Read-only: production is never seeded or written by a smoke.
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # T2: the toolkit's setup action, without the Pulumi CLI, replaces this step and the next two.
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read-only smoke
        env:
          SMOKE_READONLY: '1'
          # Gets the browser past Vercel Deployment Protection.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm smoke
