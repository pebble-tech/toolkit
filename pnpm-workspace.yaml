packages:
  - packages/*
  - examples/*
  - bootstrap
  - cluster-operators
allowBuilds:
  # protobufjs (through @pulumi/pulumi) only prints a version-scheme warning from postinstall
  protobufjs: false
  simple-git-hooks: true
  # esbuild (through payload's tsx and drizzle-kit, dev-only in @pebbletech/cms) only checks its platform binary from
  # postinstall; the binary comes from its optional platform package either way
  esbuild: false
catalog:
  '@pulumi/pulumi': 3.271.0
  '@types/node': 24.19.2
  typescript: 7.0.2
  vitest: 5.0.5

overrides:
  '@types/node': 'catalog:'
